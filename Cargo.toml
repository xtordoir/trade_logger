[package]
name = "trade_logger"
version = "0.1.0"
edition = "2021"


[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.11"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["rt", "sync"] }
chrono = { version = "0.4", features = ["serde"] }